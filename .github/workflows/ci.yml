name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # TODO: remove continue-on-error once the ~50 pre-existing lint errors are fixed.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # `next build` is intentionally not run here: it needs Supabase/Mapbox secrets.
